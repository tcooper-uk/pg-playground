<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="replica-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="wal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#wal-grad)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="500" y1="0" x2="500" y2="280"/>
    <line x1="700" y1="0" x2="700" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="900" y1="0" x2="900" y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
    <line x1="1100" y1="0" x2="1100" y2="280"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="220" cy="140" r="90" fill="#3b82f6" fill-opacity="0.07"/>
  <circle cx="980" cy="140" r="90" fill="#8b5cf6" fill-opacity="0.07"/>

  <!-- ── PRIMARY DB ── -->
  <!-- cylinder body -->
  <rect x="90" y="95" width="170" height="110" rx="6" fill="#1e2433" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- cylinder top ellipse -->
  <ellipse cx="175" cy="95" rx="85" ry="18" fill="#253048" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- cylinder bottom ellipse -->
  <ellipse cx="175" cy="205" rx="85" ry="18" fill="#1a2035" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- inner lines -->
  <line x1="90" y1="115" x2="260" y2="115" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="90" y1="135" x2="260" y2="135" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="90" y1="155" x2="260" y2="155" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="90" y1="175" x2="260" y2="175" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.4"/>
  <!-- blue dot indicator -->
  <circle cx="175" cy="95" r="5" fill="#3b82f6" filter="url(#glow-blue)"/>
  <!-- label -->
  <text x="175" y="245" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#3b82f6" letter-spacing="2">PRIMARY</text>
  <text x="175" y="262" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#4b6fa8" letter-spacing="1">:5432</text>

  <!-- ── WAL STREAM ── -->
  <!-- main arrow -->
  <line x1="272" y1="140" x2="918" y2="140" stroke="url(#wal-grad)" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrowhead)"/>
  <!-- WAL packets -->
  <rect x="360" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#3b82f6" stroke-width="1"/>
  <text x="378" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#60a5fa">WAL</text>
  <rect x="450" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#6366f1" stroke-width="1"/>
  <text x="468" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#818cf8">WAL</text>
  <rect x="540" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#7c3aed" stroke-width="1"/>
  <text x="558" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">WAL</text>
  <rect x="630" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#6366f1" stroke-width="1"/>
  <text x="648" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#818cf8">WAL</text>
  <rect x="720" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#3b82f6" stroke-width="1"/>
  <text x="738" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#60a5fa">WAL</text>
  <rect x="810" y="126" width="36" height="28" rx="4" fill="#1e2433" stroke="#7c3aed" stroke-width="1"/>
  <text x="828" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa">WAL</text>
  <!-- stream label -->
  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6b7280" letter-spacing="3">LOGICAL REPLICATION</text>

  <!-- ── REPLICA DB ── -->
  <rect x="940" y="95" width="170" height="110" rx="6" fill="#1e1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <ellipse cx="1025" cy="95" rx="85" ry="18" fill="#251f3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <ellipse cx="1025" cy="205" rx="85" ry="18" fill="#1a1628" stroke="#8b5cf6" stroke-width="1.5"/>
  <line x1="940" y1="115" x2="1110" y2="115" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="940" y1="135" x2="1110" y2="135" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="940" y1="155" x2="1110" y2="155" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="940" y1="175" x2="1110" y2="175" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.4"/>
  <circle cx="1025" cy="95" r="5" fill="#8b5cf6" filter="url(#glow-purple)"/>
  <text x="1025" y="245" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#8b5cf6" letter-spacing="2">REPLICA</text>
  <text x="1025" y="262" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#6b4fa8" letter-spacing="1">:5433</text>

  <!-- ── TITLE ── -->
  <text x="600" y="52" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="6">PG PLAYGROUND</text>
  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#4b5563" letter-spacing="4">SIMULATE · REPLICATE · OBSERVE</text>
</svg>
