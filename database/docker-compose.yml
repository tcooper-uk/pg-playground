version: "3"

services:
  dvdrental-primary:
    image: "postgres:18"
    ports:
      - 5432:5432
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=20"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dvdrental
    volumes:
      - ./datadir/dvd-pgdata/:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dvdrental']
      interval: 5s
      timeout: 5s
      retries: 10

  dvdrental-replica:
    image: "postgres:18"
    ports:
      - 5433:5432
    command: ["postgres", "-c", "max_active_replication_origins=20"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dvdrental
    volumes:
      - ./datadir/dvd-replica-pgdata/:/var/lib/postgresql
    depends_on:
      dvdrental-primary:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dvdrental']
      interval: 5s
      timeout: 5s
      retries: 10
